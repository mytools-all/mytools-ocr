<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>讯飞 OCR</title>
    <link rel="stylesheet" href="tool.css" />
    <style>
      #drop {
        border: 2px dashed var(--border);
        text-align: center;
        padding: 24px;
      }
      #drop.over {
        border-color: var(--accent);
        background: var(--soft);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <strong>讯飞 OCR</strong>
        <div class="tabs">
          <button id="recognize-tab" class="active">文字识别</button
          ><button id="settings-tab">接口设置</button
          ><button id="history-tab">识别历史</button>
        </div>
        <span class="spacer"></span><button id="theme">◐</button>
      </div>
      <section
        id="recognize"
        style="display: flex; flex-direction: column; flex: 1; min-height: 0"
      >
        <div class="split">
          <div class="content stack">
            <div id="drop" class="panel" tabindex="0">
              <p>拖拽图片到这里，或 Ctrl+V 粘贴图片</p>
              <button id="choose">选择图片</button
              ><input
                id="file"
                type="file"
                accept="image/png,image/jpeg,image/bmp"
                hidden
              />
              <p class="muted">JPG / PNG / BMP · 最大 3 MB</p>
              <img
                id="image"
                style="max-width: 100%; max-height: 230px"
                hidden
              />
            </div>
            <button id="run" class="primary">开始识别</button>
          </div>
          <textarea
            id="result"
            class="editor"
            placeholder="识别结果将在这里显示，可直接编辑…"
            aria-label="OCR 识别结果"
          ></textarea>
        </div>
        <div class="toolbar">
          <label><input id="merge" type="checkbox" />合并行</label
          ><span class="spacer"></span><button id="copy">复制文字</button
          ><button id="export">导出 TXT</button>
        </div>
      </section>
      <section id="settings" class="content stack hidden">
        <strong>讯飞通用文字识别 WebAPI</strong>
        <p class="muted">
          图片仅在点击「开始识别」后上传至讯飞。请填写自己的接口凭据。
        </p>
        <label
          >App ID <input id="appid" autocomplete="off" style="flex: 1" /></label
        ><label
          >API Key
          <input
            id="key"
            type="password"
            autocomplete="off"
            style="flex: 1" /></label
        ><label
          >识别模式
          <select id="mode">
            <option value="print">印刷文字识别（WebAPI）</option>
            <option value="handwrite">手写文字识别</option>
          </select></label
        ><label
          ><input
            id="remember"
            type="checkbox"
          />将凭据保存在本机（插件存储为明文）</label
        >
        <div class="row">
          <button id="save" class="primary">保存设置</button
          ><button id="forget">清除保存的凭据</button>
        </div>
      </section>
      <section id="history" class="content hidden"></section>
      <footer id="status" class="status" role="status"></footer>
    </main>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
